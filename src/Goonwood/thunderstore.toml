[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "bananasov"
name = "Goonwood"
description = "TODO: Fill in short mod description."
websiteUrl = "" # TODO: Add a link to your mod repository here (optional)
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
MonoDetour-MonoDetour_BepInEx_5 = "0.7.13"
MonoDetour-MonoDetour = "0.7.13"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/Goonwood/release/com.github.bananasov.goonwood.dll"
target = "plugins/"

[[build.copy]]
source = "../../artifacts/bin/Goonwood/release/Buttplug.dll"
target = "plugins/"

[[build.copy]]
source = "../../artifacts/bin/Goonwood/release/Newtonsoft.Json.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "gloomwood", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/peak/category/
gloomwood = [ "mods", ]
